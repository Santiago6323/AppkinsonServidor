# Bloque para el nginx de la página web (research-site-v2/nginx.conf), dentro de
# "server { listen 80; ... }", ANTES de "location / { ... }".
#
# Requisito: el contenedor appkinson_api debe estar en la misma red que nginx_proxy
# (RED_PROXY en el .env de Appkinson).
#
# La app usa:  https://gita.udea.edu.co/appkinson/api/v1

location /appkinson/ {
    # "resolver" + variable: nginx no se cae si Appkinson está apagado al arrancar.
    resolver 127.0.0.11 valid=30s;
    set $appkinson http://appkinson_api:8000;
    rewrite ^/appkinson/(.*)$ /$1 break;
    proxy_pass $appkinson;

    client_max_body_size 200M;      # grabaciones (por defecto nginx acepta solo 1 MB)
    proxy_request_buffering off;    # pasa los videos a la API sin acumularlos en nginx
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
